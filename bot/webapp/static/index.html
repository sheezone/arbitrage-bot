<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Матч-Радар</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<link rel="stylesheet" href="style.css?v=202610030209">
<link rel="stylesheet" href="home.css?v=202610030209">
</head>
<body>
<div class="bg-anim" aria-hidden="true">
  <span class="blob blob-1"></span>
  <span class="blob blob-2"></span>
  <span class="blob blob-3"></span>
</div>
<div id="splash">
  <div class="splash-logo">
    <svg class="radar-logo radar-splash" viewBox="0 0 100 100" aria-hidden="true">
        <defs>
          <radialGradient id="rdBg" cx="50%" cy="50%" r="50%"><stop offset="0%" stop-color="#3b1670"/><stop offset="100%" stop-color="#14062a"/></radialGradient>
          <linearGradient id="rdSweep" x1="0" y1="0" x2="1" y2="0"><stop offset="0%" stop-color="#c58bff" stop-opacity="0"/><stop offset="100%" stop-color="#d9b3ff" stop-opacity="0.85"/></linearGradient>
          <clipPath id="rdClip"><circle cx="50" cy="50" r="46"/></clipPath>
        </defs>
        <circle cx="50" cy="50" r="46" fill="url(#rdBg)" stroke="#b26bff" stroke-width="2.5"/>
        <g clip-path="url(#rdClip)" stroke="#8e4fe0" stroke-width="0.8" fill="none" opacity="0.8">
          <path d="M14 0V100M32 0V100M50 0V100M68 0V100M86 0V100M0 14H100M0 32H100M0 50H100M0 68H100M0 86H100"/>
        </g>
        <g stroke="#b26bff" stroke-width="1.6" fill="none">
          <circle cx="50" cy="50" r="34"/><circle cx="50" cy="50" r="22"/><circle cx="50" cy="50" r="10"/>
        </g>
        <g class="rd-sweep" clip-path="url(#rdClip)">
          <path d="M50 50 L50 4 A46 46 0 0 1 82.5 17.5 Z" fill="url(#rdSweep)"/>
          <line x1="50" y1="50" x2="82.5" y2="17.5" stroke="#f0dcff" stroke-width="2.2" stroke-linecap="round"/>
        </g>
        <g class="rd-blips" fill="#ff7ce8">
          <circle cx="72" cy="30" r="3.4" style="animation-delay:0.35s"/>
          <circle cx="66" cy="70" r="3" style="animation-delay:1.1s"/>
          <circle cx="28" cy="66" r="3.4" style="animation-delay:1.85s"/>
          <circle cx="32" cy="26" r="2.8" style="animation-delay:2.6s"/>
          <circle cx="58" cy="44" r="2.4" style="animation-delay:0.15s"/>
        </g>
        <circle cx="50" cy="50" r="3" fill="#f0dcff"/>
      </svg>
  </div>
  <div class="splash-title">Матч-Радар</div>
  <div class="splash-bar"><span></span></div>
</div>
<div id="app">
  <header class="topbar">
    <div class="brand">
      <svg class="radar-logo" viewBox="0 0 100 100" aria-hidden="true">
        <defs>
          <radialGradient id="rdBg" cx="50%" cy="50%" r="50%"><stop offset="0%" stop-color="#3b1670"/><stop offset="100%" stop-color="#14062a"/></radialGradient>
          <linearGradient id="rdSweep" x1="0" y1="0" x2="1" y2="0"><stop offset="0%" stop-color="#c58bff" stop-opacity="0"/><stop offset="100%" stop-color="#d9b3ff" stop-opacity="0.85"/></linearGradient>
          <clipPath id="rdClip"><circle cx="50" cy="50" r="46"/></clipPath>
        </defs>
        <circle cx="50" cy="50" r="46" fill="url(#rdBg)" stroke="#b26bff" stroke-width="2.5"/>
        <g clip-path="url(#rdClip)" stroke="#8e4fe0" stroke-width="0.8" fill="none" opacity="0.8">
          <path d="M14 0V100M32 0V100M50 0V100M68 0V100M86 0V100M0 14H100M0 32H100M0 50H100M0 68H100M0 86H100"/>
        </g>
        <g stroke="#b26bff" stroke-width="1.6" fill="none">
          <circle cx="50" cy="50" r="34"/><circle cx="50" cy="50" r="22"/><circle cx="50" cy="50" r="10"/>
        </g>
        <g class="rd-sweep" clip-path="url(#rdClip)">
          <path d="M50 50 L50 4 A46 46 0 0 1 82.5 17.5 Z" fill="url(#rdSweep)"/>
          <line x1="50" y1="50" x2="82.5" y2="17.5" stroke="#f0dcff" stroke-width="2.2" stroke-linecap="round"/>
        </g>
        <g class="rd-blips" fill="#ff7ce8">
          <circle cx="72" cy="30" r="3.4" style="animation-delay:0.35s"/>
          <circle cx="66" cy="70" r="3" style="animation-delay:1.1s"/>
          <circle cx="28" cy="66" r="3.4" style="animation-delay:1.85s"/>
          <circle cx="32" cy="26" r="2.8" style="animation-delay:2.6s"/>
          <circle cx="58" cy="44" r="2.4" style="animation-delay:0.15s"/>
        </g>
        <circle cx="50" cy="50" r="3" fill="#f0dcff"/>
      </svg>
      <span class="brand-text"><b>МАТЧ-РАДАР</b><small>AI ПРОГНОЗЫ</small></span>
    </div>
    <div class="topbar-right">
      <div class="lang-picker">
        <button id="lang-btn" class="icon-btn" title="Забон / Язык / Language">🌐</button>
        <div id="lang-menu" class="lang-menu" hidden>
          <button class="lang-menu-item" data-lang="ru">🇷🇺 Русский</button>
          <button class="lang-menu-item" data-lang="en">🇬🇧 English</button>
          <button class="lang-menu-item" data-lang="tg">🇹🇯 Тоҷикӣ</button>
        </div>
      </div>
      <button id="calc-btn" class="icon-btn" title="Калькулятор" hidden>🧮</button>
      <button id="refresh-btn" class="icon-btn" title="Обновить" hidden>🔄</button>
      <div id="user-chip" class="user-chip"></div>
    </div>
    <div id="topbar-title" hidden></div>
  </header>
  <div class="topbar-line"></div>

  <nav class="tabs" hidden>
    <button class="tab active" data-tab="vilki">Вилки</button>
    <button class="tab" data-tab="news">Новости</button>
    <button class="tab" data-tab="settings">Настройки</button>
    <button class="tab" data-tab="sub">Подписка</button>
    <button class="tab" data-tab="admin" id="admin-tab" hidden>Админ</button>
  </nav>

  <div id="screen-head" class="screen-head" hidden>
    <button type="button" id="screen-back" class="screen-back">‹</button>
    <span id="screen-title"></span>
    <span id="screen-actions" class="screen-actions"></span>
  </div>

  <div class="content-wrap">
    <div id="ptr-indicator">🔄</div>
    <main id="content"></main>
  </div>
  <div id="toast" class="toast"></div>
  <nav class="bottom-nav">
    <button type="button" class="bn-item" data-go="help"><span class="bn-ico">🧠</span><span>Помощь</span></button>
    <button type="button" class="bn-item bn-max" data-go="sub"><span class="bn-ico">💎</span><span>MAX</span></button>
    <button type="button" class="bn-item" data-go="support"><span class="bn-ico">🎧</span><span>Поддержка</span></button>
  </nav>

  <div id="stats-modal" class="modal" hidden>
    <div class="modal-backdrop"></div>
    <div class="modal-panel" role="dialog" aria-modal="true">
      <div class="modal-head">
        <span id="stats-modal-title">Статистика</span>
        <button id="stats-close" class="modal-close" aria-label="Закрыть">✕</button>
      </div>
      <div id="stats-body"></div>
    </div>
  </div>
  <div id="calc-modal" class="modal" hidden>
    <div class="modal-backdrop"></div>
    <div class="modal-panel" role="dialog" aria-modal="true">
      <div class="modal-head">
        <span id="calc-modal-title">Калькулятор</span>
        <button id="calc-close" class="modal-close" aria-label="Закрыть">✕</button>
      </div>
      <div id="calc-body"></div>
    </div>
  </div>

  <div id="analysis-modal" class="modal modal-full" hidden>
    <div class="modal-backdrop"></div>
    <div class="modal-panel" role="dialog" aria-modal="true">
      <div class="modal-head">
        <span id="analysis-modal-title">Анализ матча</span>
        <button id="analysis-close" class="modal-close" aria-label="Закрыть">✕</button>
      </div>
      <div id="analysis-body"></div>
    </div>
  </div>
</div>
<script src="app.js?v=202610030209"></script>
</body>
</html>

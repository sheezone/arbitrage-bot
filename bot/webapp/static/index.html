<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Арбитражный бот</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="bg-anim" aria-hidden="true">
  <span class="blob blob-1"></span>
  <span class="blob blob-2"></span>
  <span class="blob blob-3"></span>
</div>
<div id="splash">
  <div class="splash-logo">
    <span class="splash-ring"></span>
    <span class="splash-emoji">⚡</span>
  </div>
  <div class="splash-title">Арбитражный бот</div>
  <div class="splash-bar"><span></span></div>
</div>
<div id="app">
  <header class="topbar">
    <div class="topbar-title" id="topbar-title">🔍 Арбитражный бот</div>
    <div class="lang-picker">
      <button id="lang-btn" class="icon-btn" title="Забон / Язык / Language">🌐</button>
      <div id="lang-menu" class="lang-menu" hidden>
        <button class="lang-menu-item" data-lang="ru">🇷🇺 Русский</button>
        <button class="lang-menu-item" data-lang="en">🇬🇧 English</button>
        <button class="lang-menu-item" data-lang="tg">🇹🇯 Тоҷикӣ</button>
      </div>
    </div>
    <button id="refresh-btn" class="icon-btn" title="Обновить">🔄</button>
  </header>

  <nav class="tabs">
    <button class="tab active" data-tab="vilki">Вилки</button>
    <button class="tab" data-tab="news">Новости</button>
    <button class="tab" data-tab="calc">Калькулятор</button>
    <button class="tab" data-tab="settings">Настройки</button>
    <button class="tab" data-tab="stats">Статистика</button>
    <button class="tab" data-tab="admin" id="admin-tab" hidden>Админ</button>
  </nav>

  <div class="content-wrap">
    <div id="ptr-indicator">🔄</div>
    <main id="content"></main>
  </div>
  <div id="toast" class="toast"></div>
</div>
<script src="app.js"></script>
</body>
</html>
